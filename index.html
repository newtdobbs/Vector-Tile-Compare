<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Vector Tile Compare</title>

  <script type="module" src="https://js.arcgis.com/5.0/"></script>
  <link rel="stylesheet" href="./style.css" />

</head>

<body>

  <calcite-shell content-behind>

     <calcite-navigation slot="header">
       <calcite-navigation-logo slot="logo" heading="Esri Vector Basemap Tile Statistics">
      </calcite-navigation-logo>
      <calcite-menu slot="content-end">
        <calcite-button id="sign-in-button" type="button">Sign In</calcite-button>
      </calcite-menu>
    </calcite-navigation>

    <calcite-shell-panel slot="panel-start" id="shell-panel" collapsible>
         <calcite-action-bar id="action-bar" slot="action-bar">
            <calcite-action-group>
              <calcite-action data-action-id="fields-panel" icon="list-button" text="Field" text-enabled></calcite-action>
              <calcite-action data-action-id="layers-panel" text="Layers" icon="layers" text-enabled></calcite-action>
              <calcite-action data-action-id="basemap-panel" icon="basemap" text="Basemap" text-enabled></calcite-action>
            </calcite-action-group>
        </calcite-action-bar>
        <!-- panel for the field list -->
        <calcite-panel data-panel-id="fields-panel" heading="Fields" id="fields-panel" closable>
          <calcite-list id="fields-list">
          </calcite-list>
        </calcite-panel>

        <!-- panel for the layer list -->
        <calcite-panel data-panel-id="layers-panel" heading="Layers" id="layers-panel" closed hidden closable>
        <!-- <calcite-list label="layers" display-mode="nested" selection-mode="multiple" id="layer-list">
          <calcite-list-item selected label="Top Layer (Blue)" id="top-list-item">
            <calcite-list selection-mode="single-persist" id="top-list">

            </calcite-list>
          </calcite-list-item>
          <calcite-list-item selected label="Bottom Layer (Red)" id="bottom-list-item">
            <calcite-list selection-mode="single-persist" id="bottom-list">
  
            </calcite-list>
          </calcite-list-item>
        </calcite-list>-->
        <calcite-button label="Reset Lists" id="reset-list-button" width="full">Reset Lists</calcite-button> 
        <calcite-list drag-enabled selection-mode="multiple" selection-appearance="icon" label="Layers" id="layer-list"></calcite-list>
        
      </calcite-panel>

        <!-- panel for basemaps -->
        <calcite-panel data-panel-id="basemap-panel" heading="Basemap" id="basemap-panel" closed hidden closable>
            <arcgis-basemap-gallery reference-element="mapEl"></arcgis-basemap-gallery>
        </calcite-panel>
    </calcite-shell-panel>



    <arcgis-map id="mapEl">

      <arcgis-zoom slot="top-left"></arcgis-zoom>

    </arcgis-map>

  </calcite-shell>
  <calcite-loader id="app-loader"></calcite-loader> 

</body>
<script type="module" src="/main.js"></script>
</html>
