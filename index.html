<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Vector Tile Compare</title>

  <script type="module" src="https://js.arcgis.com/5.0/"></script>
  <link rel="stylesheet" href="./style.css" />

</head>

<body>

  <calcite-shell>

     <calcite-navigation slot="header">
       <calcite-navigation-logo slot="logo" heading="Esri Vector Basemap Tile Statistics">
      </calcite-navigation-logo>
      <calcite-menu slot="content-end">
        <calcite-button id="sign-in-button" type="button">Sign In</calcite-button>
      </calcite-menu>
    </calcite-navigation>

    <calcite-shell-panel slot="panel-start" id="shell-panel" collapsible>
        <calcite-action-bar id="action-bar" slot="action-bar" expanded>
          <calcite-action-group>
            <calcite-action data-action-id="fields-panel" icon="list-button" text="Field" text-enabled></calcite-action>
            <calcite-action data-action-id="layers-panel" text="Layers" icon="layers" text-enabled></calcite-action>
            <calcite-action data-action-id="basemap-panel" icon="basemap" text="Basemap" text-enabled></calcite-action>
          </calcite-action-group>
        </calcite-action-bar>

        <!-- panel for the field list -->
        <calcite-panel data-panel-id="fields-panel" heading="Fields" id="fields-panel">
          <calcite-list id="fields-list" selection-mode="single">
          </calcite-list>
        </calcite-panel>

        <!-- panel for the layer list -->
        <calcite-panel data-panel-id="layers-panel" heading="Layers" id="layers-panel" closed hidden>
        <!-- top outer tree for dropdown -->
        <calcite-tree id="top-outer-tree">
          <calcite-tree-item selection-mode="single" expanded>Top Layer (Blue)
            <calcite-tree slot="children" id="top-tree" lines>
              <!-- the top inner tree where layers will be added -->
            </calcite-tree>
          </calcite-tree-item>
        </calcite-tree>
        
        <!-- bottom outer tree for dropdown -->
        <calcite-tree id="bottom-outer-tree">
          <calcite-tree-item selection-mode="single" expanded>Bottom Layer (Red)
            <calcite-tree slot="children" id="bottom-tree" lines>
              <!-- the bottom inner tree where layers will be added -->
            </calcite-tree>
          </calcite-tree-item>
        </calcite-tree>
      </calcite-panel>

      <!-- panel for basemaps -->
      <calcite-panel data-panel-id="basemap-panel" heading="Basemap" id="basemap-panel" closed hidden>
        <arcgis-basemap-gallery reference-element="mapEl" id="basemapGallery"></arcgis-basemap-gallery>
      </calcite-panel>



    </calcite-shell-panel>



    <arcgis-map id="mapEl">

      <arcgis-zoom slot="top-left"></arcgis-zoom>

    </arcgis-map>

  </calcite-shell>
  <calcite-loader id="app-loader"></calcite-loader> 

</body>
<script type="module" src="/main.js"></script>
</html>
