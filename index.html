<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Vector Tile Compare</title>

  <script type="module" src="https://js.arcgis.com/5.0/"></script>
  <link rel="stylesheet" href="./style.css" />

</head>

<body>

  <calcite-shell content-behind>

     <calcite-navigation slot="header">
       <calcite-navigation-logo slot="logo" heading="Esri Vector Basemap Tile Statistics">
      </calcite-navigation-logo>
      <calcite-menu slot="content-end">
        <calcite-button id="sign-in-button" type="button">Sign In</calcite-button>
      </calcite-menu>
    </calcite-navigation>

    <calcite-shell-panel display-mode="float-all" slot="panel-end">
      <calcite-panel menu-placement="start">
          <calcite-action-bar id="map-actions" slot="action-bar" layout="horizontal" expand-disabled>
            <calcite-action icon="list-button" text="Field" data-action-id="field"></calcite-action>
            <calcite-action icon="layers" text="Layers" data-action-id="layers"></calcite-action>
            <calcite-action icon="basemap" text="Basemap" data-action-id="basemaps"></calcite-action>
            <calcite-action icon="legend" text="Legend" data-action-id="legend"></calcite-action>
         </calcite-action-bar>
         <calcite-block collapsible expanded heading="Layer effects" description="Adjust blur, highlight, and more"
         icon-start="effects">
         <calcite-notice open>
           <div slot="message">Use layer effects sparingly, for emphasis</div>
          </calcite-notice>
          <calcite-action slot="control" text="Information" icon="information"></calcite-action>
          <div slot="header-menu-actions">
            <calcite-action text="Information" icon="information" text-enabled></calcite-action>
          </div>
        </calcite-block>
      </calcite-panel>
      <!-- <calcite-block expanded heading="Filter Field" data-block-id="field" >
        <calcite-list id="fields-list"></calcite-list>
      </calcite-block>
      <calcite-block expanded heading="Layers" data-block-id="layers" hidden>
        <arcgis-layer-list drag-enabled reference-element="mapEl" visibility-appearance="checkbox"></arcgis-layer-list>
      </calcite-block>

      <calcite-block expanded heading="Basemaps" data-block-id="basemaps" hidden>
        <arcgis-basemap-gallery reference-element="mapEl"></arcgis-basemap-gallery>
      </calcite-block>
      <calcite-block expanded heading="Legend" data-block-id="legend" hidden>
        <arcgis-legend legend-style="classic" reference-element="mapEl"></arcgis-legend>
      </calcite-block> -->
    </calcite-shell-panel>



    <arcgis-map id="mapEl">

      <arcgis-zoom slot="top-left"></arcgis-zoom>

    </arcgis-map>

  </calcite-shell>
  <calcite-loader id="app-loader"></calcite-loader> 

</body>
<script type="module" src="/main.js"></script>
</html>
