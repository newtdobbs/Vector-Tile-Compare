<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Vector Tile Compare</title>

  <script type="module" src="https://js.arcgis.com/5.0/"></script>
  <link rel="stylesheet" href="./style.css" />

</head>

<body>

  <calcite-shell>

     <calcite-navigation slot="header">
       <calcite-navigation-logo slot="logo" heading="Esri Vector Basemap Tile Statistics">
      </calcite-navigation-logo>
      <calcite-menu slot="content-end">
        <calcite-button id="sign-in-button" type="button">Sign In</calcite-button>
      </calcite-menu>
    </calcite-navigation>

    <calcite-shell-panel slot="panel-start" id="shell-panel-start">
        <calcite-panel heading="Map Options" id="panel-start">
          <calcite-accordion>

            <!-- the fields list -->
            <calcite-accordion-item icon-start="list-button" heading="Fields" description="Change the filter field">
              <calcite-list id="fields-list" selection-mode="single"></calcite-list>
            </calcite-accordion-item>
            
            <!-- the layer trees -->
            <calcite-accordion-item icon-start="layers" heading="Layers" description="Swap layers visible in the map">
              <calcite-tree id="top-outer-tree">
                <calcite-tree-item selection-mode="single" expanded>Top Layer (Blue)
                  <calcite-tree slot="children" id="top-tree" lines></calcite-tree>
                </calcite-tree-item>
              </calcite-tree>

              <calcite-tree id="bottom-outer-tree">
                <calcite-tree-item selection-mode="single" expanded>Bottom Layer (Red)
                  <calcite-tree slot="children" id="bottom-tree" lines>
                  </calcite-tree>
                </calcite-tree-item>
              </calcite-tree>
            </calcite-accordion-item>
         
            <!-- the basemap gallery -->
            <calcite-accordion-item icon-start="basemap" heading="Basemap" description="Update the basemap">
              <arcgis-basemap-gallery reference-element="mapEl" id="basemapGallery"></arcgis-basemap-gallery>
            </calcite-accordion-item>
     
        </calcite-accordion>
      </calcite-panel>
    </calcite-shell-panel>

    <arcgis-map id="mapEl">
      <arcgis-zoom slot="top-right"></arcgis-zoom>
    </arcgis-map>

  </calcite-shell>
  <calcite-loader id="app-loader"></calcite-loader> 

</body>
<script type="module" src="/main.js"></script>
</html>
