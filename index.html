<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Vector Tile Compare</title>

  <script type="module" src="https://js.arcgis.com/5.0/"></script>
  <link rel="stylesheet" href="./style.css" />

</head>

<body>

  <calcite-shell content-behind>

     <calcite-navigation slot="header">
       <calcite-navigation-logo slot="logo" heading="Esri Vector Basemap Tile Statistics">
      </calcite-navigation-logo>
      <calcite-menu slot="content-end">
        <calcite-button id="sign-in-button" type="button">Sign In</calcite-button>
      </calcite-menu>
    </calcite-navigation>

    <calcite-shell-panel slot="panel-end" id="shell-panel-start" display-mode="float-all" collapsible>
         <calcite-action-bar slot="action-bar">
            <calcite-action-group>
              <calcite-action active icon="list-button" text="Field" text-enabled></calcite-action>
              <calcite-action text="Layers" indicator icon="layers" text-enabled></calcite-action>
              <calcite-action icon="basemap" text="Basemap" text-enabled></calcite-action>
            </calcite-action-group>
        </calcite-action-bar>
        <!-- panel for the field list -->
        <calcite-panel heading="Fields" id="panel-start" closable>
          <calcite-list id="fields-list">
          </calcite-list>
        </calcite-panel>

        <!-- panel for the layer list -->
         <calcite-panel heading="Layers" id="panel-start" closable closed>
            <calcite-list id="layer-list">
            </calcite-list>
        </calcite-panel>
      <!-- <calcite-block expanded heading="Filter Field" data-block-id="field" >
        <calcite-list id="fields-list"></calcite-list>
      </calcite-block>
      <calcite-block expanded heading="Layers" data-block-id="layers" hidden>
        <arcgis-layer-list drag-enabled reference-element="mapEl" visibility-appearance="checkbox"></arcgis-layer-list>
      </calcite-block>

      <calcite-block expanded heading="Basemaps" data-block-id="basemaps" hidden>
        <arcgis-basemap-gallery reference-element="mapEl"></arcgis-basemap-gallery>
      </calcite-block>
      <calcite-block expanded heading="Legend" data-block-id="legend" hidden>
        <arcgis-legend legend-style="classic" reference-element="mapEl"></arcgis-legend>
      </calcite-block> -->
    </calcite-shell-panel>



    <arcgis-map id="mapEl">

      <arcgis-zoom slot="top-left"></arcgis-zoom>

    </arcgis-map>

  </calcite-shell>
  <calcite-loader id="app-loader"></calcite-loader> 

</body>
<script type="module" src="/main.js"></script>
</html>
